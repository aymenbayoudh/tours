name: Build road graph audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/prepare_road_graph.py"
      - ".github/workflows/road-graph.yml"

permissions:
  contents: read

concurrency:
  group: road-graph-audit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build compact IGN BD TOPO walking and cycling graphs
        run: |
          python3 tests/bike_profile.test.py
          python3 scripts/prepare_road_graph.py
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          for name in ("road_graph.json", "bike_graph.json"):
              p=Path("data/tours")/name
              if not p.exists():
                  print(json.dumps({"file": name, "missing": True}, indent=2))
                  continue
              d=json.loads(p.read_text())
              raw=p.stat().st_size
              gz=len(gzip.compress(p.read_bytes(), compresslevel=9))
              print(json.dumps({
                  "file": name,
                  "nodes": len(d.get("nodes", [])),
                  "edges": len(d.get("edges", [])),
                  "stats": d.get("stats", {}),
                  "rawBytes": raw,
                  "gzipBytes": gz,
              }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: road-graph
          path: |
            data/tours/road_graph.json
            data/tours/bike_graph.json
          retention-days: 1
