name: Materialize official TER traces

on:
  push:
    paths:
      - ".github/workflows/materialize-ter-traces.yml"
      - "scripts/prepare_ter_route_shapes.py"
      - "build_data.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download official SNCF Réseau RFN geometry
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          urls = [
            "https://data.sncf.com/api/explore/v2.1/catalog/datasets/formes-des-lignes-du-rfn/exports/geojson?lang=fr&timezone=Europe%2FParis",
            "https://data.sncf.com/explore/dataset/formes-des-lignes-du-rfn/download/?format=geojson&timezone=Europe%2FParis&lang=fr",
          ]
          error = None
          for url in urls:
              for attempt in range(4):
                  try:
                      print("Downloading", url, "attempt", attempt + 1)
                      with urllib.request.urlopen(url, timeout=120) as r:
                          body = r.read()
                      data = json.loads(body)
                      assert data.get("type") == "FeatureCollection"
                      assert len(data.get("features", [])) > 500
                      open("/tmp/rfn.geojson", "wb").write(body)
                      print("RFN features:", len(data["features"]), "bytes:", len(body))
                      raise SystemExit(0)
                  except Exception as exc:
                      error = exc
                      print("failed:", repr(exc))
                      time.sleep(3 * (attempt + 1))
          raise SystemExit(f"Unable to download RFN GeoJSON: {error!r}")
          PY

      - name: Build missing TER route traces
        run: |
          python3 scripts/prepare_ter_route_shapes.py --rfn /tmp/rfn.geojson
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/tours/ter_route_shapes.json")
          d=json.loads(p.read_text())
          print(json.dumps({"bytes":p.stat().st_size, **d["stats"]}, indent=2))
          assert d["stats"]["routesBuilt"] >= 20
          assert d["stats"]["stationsSnapped"] >= 150
          assert d["stats"]["missingAdjacentPairs"] < 25
          PY

      - name: Rebuild site and verify every scheduled rail route has geometry
        run: |
          python3 build_data.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path("data/tours/timetables.json").read_text())
          d=json.loads(Path("site/data/commute_map_data.json").read_text())
          visual={r["id"] for r in d["routes"] if r["mode"] not in ("RFN","BUS")}
          scheduled={p["routeId"] for p in t["patterns"] if p["routeId"]!="TRAM A"}
          missing=sorted(scheduled-visual)
          print("scheduled rail routes:", sorted(scheduled))
          print("missing visual routes:", missing)
          assert not missing, f"Scheduled rail routes without visual RFN trace: {missing}"
          required={"TER P10","TER P14","TER P16","TER K5+","TER K15","TER P5","TER P15"}
          official={r["id"] for r in d["routes"] if r.get("officialTrace")}
          missing_official=sorted(required-official)
          assert not missing_official, f"Complementary routes missing official trace: {missing_official}"
          PY
          node tests/routing.test.mjs
          node tests/spatial_estimate.test.mjs
          node tests/point_walking.test.mjs

      - name: Commit compact official TER traces
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tours/ter_route_shapes.json site/data/commute_map_data.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add official RFN traces for complementary TER routes"
          git push origin HEAD:main
