name: Materialize walking transfers

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/materialize-walking-transfers.yml"

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ROAD_ARTIFACT_ID: "11283641308"
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild current transit snapshot
        run: |
          python3 - <<'PY'
          import urllib.request
          url = "https://data.tours-metropole.fr/api/v2/catalog/datasets/horaires-temps-reel-gtfsrt-reseau-filbleu-tmvl/alternative_exports/filbleu_gtfszip"
          urllib.request.urlretrieve(url, "/tmp/filbleu_gtfs.zip")
          PY
          python3 scripts/prepare_filbleu_bus.py --gtfs /tmp/filbleu_gtfs.zip
          python3 build_data.py
      - name: Reuse audited BD TOPO graph and build compact transfer table
        run: |
          mkdir -p /tmp/road
          gh api -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROAD_ARTIFACT_ID}/zip" > /tmp/road.zip
          unzip -q /tmp/road.zip -d /tmp/road
          python3 scripts/prepare_walking_transfers.py \
            --road /tmp/road/road_graph.json \
            --transit site/data/commute_map_data.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/tours/walking_transfers.json")
          d=json.loads(p.read_text())
          assert d.get("generated") is True
          assert d["stats"]["coveredStops"] > 1000
          assert d["stats"]["roadWalkablePairs"] > 1000
          assert d["stats"]["snapMaxMetres"] <= d["maxSnapMetres"]
          assert p.stat().st_size < 1_000_000
          print(json.dumps({"bytes":p.stat().st_size, **d["stats"]}, indent=2))
          PY
      - name: Commit compact walking table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tours/walking_transfers.json
          if git diff --cached --quiet; then
            echo "Walking table unchanged"
            exit 0
          fi
          git commit -m "Add compact BD TOPO walking transfer table"
          git push origin HEAD:main
