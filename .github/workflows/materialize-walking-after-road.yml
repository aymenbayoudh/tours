name: Materialize walking after road audit

on:
  workflow_run:
    workflows: ["Build road graph audit"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download audited road graph
        uses: actions/download-artifact@v4
        with:
          name: road-graph
          path: /tmp/road
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Rebuild current transit snapshot
        run: |
          python3 - <<'PY'
          import urllib.request
          url = "https://data.tours-metropole.fr/api/v2/catalog/datasets/horaires-temps-reel-gtfsrt-reseau-filbleu-tmvl/alternative_exports/filbleu_gtfszip"
          urllib.request.urlretrieve(url, "/tmp/filbleu_gtfs.zip")
          PY
          python3 scripts/prepare_filbleu_bus.py --gtfs /tmp/filbleu_gtfs.zip
          python3 build_data.py
      - name: Build and verify compact BD TOPO walking table
        run: |
          python3 scripts/prepare_walking_transfers.py --road /tmp/road/road_graph.json --transit site/data/commute_map_data.json
          python3 build_data.py
          node tests/routing.test.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/tours/walking_transfers.json")
          d=json.loads(p.read_text())
          assert d.get("generated") is True
          assert d["stats"]["coveredStops"] > 1000
          assert d["stats"]["roadWalkablePairs"] > 1000
          assert d["stats"]["snapMaxMetres"] <= d["maxSnapMetres"]
          # Measured baseline before the endpoint-topology fix: 23 stop
          # components, largest containing only 634/1577 SERM stops.
          # Do not publish a rebuilt table unless connectivity materially improves.
          assert d["stats"]["stopComponents"] < 23
          assert d["stats"]["largestStopComponentStops"] > 634
          assert p.stat().st_size < 1_000_000
          print(json.dumps({"bytes": p.stat().st_size, **d["stats"]}, indent=2))
          PY
      - name: Commit compact table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tours/walking_transfers.json
          if git diff --cached --quiet; then
            echo "Walking table unchanged"
            exit 0
          fi
          git commit -m "Refresh BD TOPO walking transfer table"
          git push origin HEAD:main
