name: Refresh TER coverage fix

on:
  push:
    paths:
      - ".github/workflows/refresh-ter-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official GTFS snapshots
        run: |
          python3 - <<'PY'
          import urllib.request
          urllib.request.urlretrieve(
              "https://eu.ftp.opendatasoft.com/sncf/plandata/Export_OpenData_SNCF_GTFS_NewTripId.zip",
              "/tmp/sncf.zip",
          )
          urllib.request.urlretrieve(
              "https://data.tours-metropole.fr/api/v2/catalog/datasets/horaires-temps-reel-gtfsrt-reseau-filbleu-tmvl/alternative_exports/filbleu_gtfszip",
              "/tmp/filbleu.zip",
          )
          PY
      - name: Rebuild timetables and site data
        run: |
          python3 scripts/prepare_timetables.py --sncf /tmp/sncf.zip --filbleu /tmp/filbleu.zip
          python3 build_data.py
          python3 scripts/audit_ter_coverage.py --sncf /tmp/sncf.zip --output data/tours/ter-coverage-audit-2026-10-04-after.json
      - name: Validate requested TER corrections
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          t=json.loads(Path("data/tours/timetables.json").read_text())
          d=json.loads(Path("site/data/commute_map_data.json").read_text())
          routes=set(p["routeId"] for p in t["patterns"])
          required={"TER P14","TER P16","TER P10","TER K5+"}
          missing=sorted(required-routes)
          assert not missing, f"Missing requested TER routes: {missing}"

          def direct(route, first, second):
              for p in t["patterns"]:
                  if p["routeId"] != route: continue
                  try:
                      a=p["stops"].index(first); b=p["stops"].index(second)
                  except ValueError:
                      continue
                  if a < b and p["pickup"][a] and p["dropoff"][b]:
                      return p
              return None

          mehun="SNCF:87576116"; vierzon="SNCF:87576009"
          assert direct("TER P14", mehun, vierzon) or direct("TER P14", vierzon, mehun), "P14 Mehun–Vierzon still missing"

          info=d["routeInfo"].get("TER P21", {})
          assert info and info.get("serviceStatus",{}).get("status") != "suspended", "P21 still suspended"
          by_name={s["name"]:s for s in d["stations"]}
          for name in ["Azay-le-Rideau","Ballan","Chinon","Druye","Rivarennes"]:
              assert name in by_name, f"Missing station {name}"
              assert "TER P21" in by_name[name]["routes"], f"P21 not active at {name}"

          after=json.loads(Path("data/tours/ter-coverage-audit-2026-10-04-after.json").read_text())
          print(json.dumps({
              "railPatterns": sum(1 for p in t["patterns"] if p["routeId"] != "TRAM A"),
              "scheduledRoutes": sorted(routes),
              "directPairsNotRepresented": after["directPairsNotRepresented"],
              "p21Stations": {name: by_name[name]["routes"] for name in ["Azay-le-Rideau","Ballan","Chinon","Druye","Rivarennes"]},
          }, ensure_ascii=False, indent=2))
          PY
      - name: Run regression tests
        run: |
          python3 tests/walking_graph.test.py
          python3 tests/point_walking_preparation.test.py
          node tests/point_walking.test.mjs
          node tests/walking_surface.test.mjs
          node tests/routing.test.mjs
          node tests/bus_data.test.mjs
          node tests/spatial_estimate.test.mjs
      - name: Commit regenerated transport snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tours/timetables.json data/tours/filbleu_tram.json data/tours/ter-coverage-audit-2026-10-04-after.json site/data/commute_map_data.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Refresh TER coverage after route filter fix"
          git push origin HEAD:main
