name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tours-pages-current
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate prepared transport data
        run: |
          python3 build_data.py
          node --check site/app.js
          node --check site/routing.mjs
          node --check site/walking-engine.mjs
          node --check site/walking-worker.mjs
          python3 tests/walking_graph.test.py
          python3 tests/point_walking_preparation.test.py
          node tests/point_walking.test.mjs
          node tests/walking_surface.test.mjs
          node tests/routing.test.mjs
          node tests/ter_profile_preference.test.mjs
          node tests/bus_data.test.mjs
          node tests/spatial_estimate.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
